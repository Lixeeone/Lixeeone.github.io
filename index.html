<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Zilin Li — research portfolio and offline conversational assistant." />
  <meta name="theme-color" content="#0f0f10" />
  <title>Zilin Li — Conversational Portfolio</title>

  <style>
    :root {
      --bg: #212121;
      --panel: #171717;
      --panel-2: #2f2f2f;
      --panel-3: #383838;
      --text: #ececec;
      --muted: #a8a8a8;
      --line: rgba(255,255,255,.10);
      --accent: #10a37f;
      --accent-2: #19c37d;
      --danger: #ef6461;
      --shadow: 0 12px 34px rgba(0,0,0,.28);
      --radius: 18px;
      --sidebar-width: 270px;
      --content-width: 840px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      height: 100%;
    }

    .sidebar {
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 10px;
      z-index: 20;
    }

    .brand {
      height: 48px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-weight: 800;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.36), transparent 28%),
        linear-gradient(135deg, var(--accent), #0c725c);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .16s ease;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,.08);
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 10px;
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: .16s ease;
      margin-bottom: 10px;
      text-align: left;
    }

    .new-chat:hover {
      background: rgba(255,255,255,.06);
    }

    .history-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 12px 10px 7px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .history::-webkit-scrollbar,
    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .history::-webkit-scrollbar-thumb,
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 999px;
    }

    .history-item {
      border: 0;
      width: 100%;
      min-height: 40px;
      border-radius: 9px;
      padding: 8px 10px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-align: left;
      color: #d8d8d8;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(255,255,255,.07);
    }

    .history-item span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 8px;
      border-radius: 10px;
    }

    .profile-mini:hover {
      background: rgba(255,255,255,.05);
    }

    .mini-avatar,
    .avatar {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-weight: 700;
      user-select: none;
    }

    .mini-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #654f9d;
      font-size: 12px;
    }

    .mini-copy {
      min-width: 0;
    }

    .mini-name {
      font-size: 13px;
      font-weight: 650;
    }

    .mini-role {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .main {
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.035), transparent 33%),
        var(--bg);
    }

    .topbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid transparent;
      position: relative;
      z-index: 10;
    }

    .model-button {
      border: 0;
      border-radius: 10px;
      background: transparent;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
      font-weight: 650;
    }

    .model-button:hover {
      background: rgba(255,255,255,.06);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 5px rgba(25,195,125,.09);
    }

    .menu-mobile {
      display: none;
    }

    .chat-shell {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .messages {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding-bottom: 168px;
    }

    .welcome {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 11vh auto 0;
      animation: fadeUp .35s ease both;
    }

    .welcome-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 18px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.32), transparent 28%),
        linear-gradient(135deg, var(--accent), #0c725c);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.13);
    }

    .welcome h1 {
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: -.035em;
      margin: 0 0 10px;
    }

    .welcome p {
      max-width: 640px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
      font-size: 15px;
    }

    .suggestions {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .suggestion {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      border-radius: 14px;
      padding: 15px;
      min-height: 94px;
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .suggestion:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.055);
      border-color: rgba(255,255,255,.18);
    }

    .suggestion strong {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .suggestion span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .message {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 14px;
      animation: fadeUp .24s ease both;
    }

    .message + .message {
      border-top: 1px solid rgba(255,255,255,.035);
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 1px;
    }

    .message.user .avatar {
      border-radius: 50%;
      background: #654f9d;
    }

    .message.assistant .avatar {
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.30), transparent 28%),
        linear-gradient(135deg, var(--accent), #0c725c);
    }

    .message-body {
      min-width: 0;
      line-height: 1.72;
      color: #ededed;
      font-size: 15px;
      word-break: break-word;
    }

    .message-meta {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message-body p {
      margin: 0 0 10px;
    }

    .message-body p:last-child {
      margin-bottom: 0;
    }

    .message-body ul {
      margin: 8px 0 10px 20px;
      padding: 0;
    }

    .message-body li {
      margin: 4px 0;
    }

    .message-body strong {
      color: #fff;
      font-weight: 700;
    }

    .message-body code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: .91em;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      padding: 2px 5px;
      border-radius: 6px;
    }

    .message-body pre {
      overflow-x: auto;
      background: #111;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .message-body pre code {
      background: transparent;
      border: 0;
      padding: 0;
    }

    .message-body a {
      color: #8bc8ff;
      text-decoration: none;
      border-bottom: 1px solid rgba(139,200,255,.35);
    }

    .thinking {
      color: var(--muted);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 1px;
    }

    .thinking-dots {
      display: inline-flex;
      gap: 3px;
    }

    .thinking-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .thinking-dots i:nth-child(2) { animation-delay: .14s; }
    .thinking-dots i:nth-child(3) { animation-delay: .28s; }

    .composer-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 18px 18px;
      background: linear-gradient(180deg, rgba(33,33,33,0), var(--bg) 30%, var(--bg));
      z-index: 8;
    }

    .composer {
      width: min(var(--content-width), 100%);
      margin: 0 auto;
      min-height: 58px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 26px;
      background: var(--panel-2);
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 10px 10px 16px;
      transition: .18s ease;
    }

    .composer:focus-within {
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 8px 30px rgba(0,0,0,.26);
    }

    #prompt {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      min-height: 34px;
      max-height: 180px;
      line-height: 1.5;
      padding: 6px 0 4px;
    }

    #prompt::placeholder {
      color: #a3a3a3;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: #fff;
      color: #111;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: .16s ease;
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: .28;
      cursor: not-allowed;
    }

    .disclaimer {
      width: min(var(--content-width), 100%);
      margin: 8px auto 0;
      text-align: center;
      color: #8e8e8e;
      font-size: 10.5px;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 130px;
      transform: translateX(-50%) translateY(12px);
      background: #111;
      border: 1px solid var(--line);
      color: #eee;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 50;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .overlay {
      display: none;
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .28; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 310px);
        transform: translateX(-102%);
        transition: transform .22s ease;
        box-shadow: 18px 0 44px rgba(0,0,0,.34);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 15;
        background: rgba(0,0,0,.46);
        opacity: 0;
        pointer-events: none;
        transition: .22s ease;
      }

      .overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .menu-mobile {
        display: grid;
      }

      .topbar {
        padding: 0 10px;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .status span:last-child {
        display: none;
      }

      .welcome {
        margin-top: 7vh;
      }
    }

    @media (max-width: 600px) {
      .suggestions {
        grid-template-columns: 1fr;
      }

      .suggestion {
        min-height: 78px;
      }

      .message {
        width: calc(100% - 24px);
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 11px;
      }

      .welcome {
        width: calc(100% - 28px);
      }

      .composer-wrap {
        padding-left: 10px;
        padding-right: 10px;
      }

      .composer {
        border-radius: 22px;
      }
    }
  </style>
</head>

    <main class="main">

      </header>

      <section class="chat-shell">
        <div class="messages" id="messages" aria-live="polite"></div>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea

              rows="1"
              spellcheck="true"
              autocomplete="off"
              placeholder="Message Zilin's portfolio assistant"
              aria-label="Message"
            ></textarea>

            <button class="send-btn" id="sendBtn" type="submit" disabled aria-label="Send message">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                <path d="M12 19V5M12 5L6.5 10.5M12 5L17.5 10.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>

          <div class="disclaimer">
            Offline portfolio assistant. Responses are generated locally from curated site content and lightweight rules.
          </div>
        </div>
      </section>
    </main>
  </div>

      // ------------------------------------------------------------

      function uid() {

      function pick(array) {

      function delay(ms) {

      function normalize(text) {
        return text
          .toLowerCase()
          .replace(/[–—]/g, "-")
          .replace(/[^\w\s@.'-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function inlineMarkdown(text) {
        let safe = escapeHTML(text);
        safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
        safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        safe = safe.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        return safe;
      }

      function renderMarkdown(text) {
        const blocks = String(text).split(/\n{2,}/);
        return blocks.map(block => {
          const trimmed = block.trim();

          if (/^```/.test(trimmed) && /```$/.test(trimmed)) {
            const code = trimmed.replace(/^```[a-zA-Z0-9_-]*\n?/, "").replace(/```$/, "");
            return `<pre><code>${escapeHTML(code)}</code></pre>`;
          }

          const lines = trimmed.split("\n");
          if (lines.every(line => /^[-*]\s+/.test(line))) {
            return `<ul>${lines.map(line => `<li>${inlineMarkdown(line.replace(/^[-*]\s+/, ""))}</li>`).join("")}</ul>`;
          }

          return `<p>${lines.map(inlineMarkdown).join("<br>")}</p>`;
        }).join("");
      }

      // ------------------------------------------------------------

      function publicationSummary() {
        const current = PUBLICATIONS.slice(0, 4)
          .map((p, i) => `${i + 1}. **${p.title}** — ${p.venue}.`)
          .join("\n");

        return `The portfolio currently highlights:\n${current}\n\nIt also records earlier versions of DuoTeach and Self-Empowering VLMs submitted to ECCV, KDD, and CVPR.`;
      }

      function scoreEntry(query, entry) {
        const q = normalize(query);
        let score = 0;

        for (const keyword of entry.keywords) {
          const k = normalize(keyword);
          if (q === k) score += 8;
          else if (q.includes(k)) score += Math.min(6, 2 + k.split(" ").length);
          else {
            const words = k.split(" ");
            const overlap = words.filter(w => q.includes(w)).length;
            score += overlap * 0.55;
          }
        }

        return score;
      }

      function detectSmallTalk(q) {
        const t = normalize(q);

        if (/^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(t)) {
          return pick([
            "Hello. Ask me about Zilin's research, publications, academic background, or related machine-learning topics.",
            "Hi. I can help you explore Zilin Li's portfolio and research areas.",
            "Hello. What would you like to know about Zilin's work?"
          ]);
        }

        if (/^(thanks|thank you|thx)\b/.test(t)) {
          return pick([
            "You are welcome.",
            "Glad to help.",
            "My pleasure."
          ]);
        }

        if (/^(bye|goodbye|see you)\b/.test(t)) {
          return "Goodbye. The conversation will remain saved in this browser.";
        }

        return null;
      }

      function detectCommands(query) {
        const q = normalize(query);

        if (q === "/help" || q === "help") {
          return `Try questions such as:\n- Who is Zilin Li?\n- What are his research interests?\n- Summarize his publications.\n- Explain decentralized representation learning.\n- What is knowledge distillation?\n\nCommands: \`/clear\`, \`/about\`, and \`/help\`.`;
        }

        if (q === "/about") {
          return `This is a static, offline conversational portfolio. It uses a curated JavaScript knowledge base, intent matching, local chat memory, simulated thinking, and streamed responses. It does not call an external model or API.`;
        }

        if (q === "/clear") {
          setTimeout(deleteAllChats, 50);
          return "Clearing local conversation history.";
        }

        return null;
      }

      function answerQuestion(query) {
        const command = detectCommands(query);
        if (command) return command;

        const smallTalk = detectSmallTalk(query);
        if (smallTalk) return smallTalk;

        const ranked = KNOWLEDGE
          .map(entry => ({ entry, score: scoreEntry(query, entry) }))
          .sort((a, b) => b.score - a.score);

        const best = ranked[0];
        const second = ranked[1];

        if (best && best.score >= 2.1) {
          let response = best.entry.answer(query);

          // Blend a second relevant entry for richer, less repetitive answers.
          if (
            second &&
            second.score >= 2.8 &&
            second.entry.id !== best.entry.id &&
            Math.random() > 0.52
          ) {
            const extra = second.entry.answer(query);
            response += `\n\n${extra}`;
          }

          return response;
        }

        const compactTopic = query.trim().replace(/\s+/g, " ").slice(0, 100);
        return pick(FALLBACKS)(compactTopic || "that question");
      }

      function responseDelay(query) {
        const base = 560 + Math.random() * 850;
        const lengthFactor = Math.min(950, query.length * 8);
        return base + lengthFactor;

      async function streamAssistantMessage(text) {
        let chat = currentChat();
        if (!chat) return;

        const message = {
          id: uid(),
          role: "assistant",
          content: "",
          createdAt: Date.now()
        };

        chat.messages.push(message);
        chat.updatedAt = Date.now();
        saveChats();

        const node = messageElement(message);
        els.messages.appendChild(node);
        const body = node.querySelector(".message-body");

        // Stream by short chunks rather than one character at a time.
        const tokens = text.match(/(\s+|[^\s]+)/g) || [text];
        for (let i = 0; i < tokens.length; i++) {
          message.content += tokens[i];
          body.innerHTML = renderMarkdown(message.content);

          if (i % 3 === 0) {
            scrollToBottom();
            await delay(15 + Math.random() * 28);
          }
        }

        saveChats();
        scrollToBottom();
      }

      async function submitPrompt() {
        const text = els.prompt.value.trim();
        if (!text || state.busy) return;

        state.busy = true;
        els.prompt.value = "";
        autoResize();
        updateSendState();

        addMessage("user", text);

        const thinking = addThinkingNode();
        const total = responseDelay(text);

        const labels = [...THINKING_STEPS].sort(() => Math.random() - 0.5).slice(0, 3);
        const labelNode = thinking.querySelector(".thinking-label");

        const interval = setInterval(() => {
          labelNode.textContent = labels.shift() || pick(THINKING_STEPS);
        }, Math.max(420, total / 2.2));

        await delay(total);
        clearInterval(interval);
        thinking.remove();

        const answer = answerQuestion(text);
        await streamAssistantMessage(answer);

        state.busy = false;
        updateSendState();
        els.prompt.focus();
      }

        if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "o") {
          event.preventDefault();
          createChat();
        }
      });

      // ------------------------------------------------------------
      // Initial load
      // ------------------------------------------------------------
      if (state.chats.length) {
        state.currentId = [...state.chats].sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
      }

      renderAll();
      updateSendState();
      autoResize();

      // Expose a tiny debugging surface for easy customization.
      window.PortfolioGPT = {
        profile: PROFILE,
        publications: PUBLICATIONS,
        knowledge: KNOWLEDGE,
        clear: deleteAllChats
      };
    })();
  </script>
</body>
</html>
